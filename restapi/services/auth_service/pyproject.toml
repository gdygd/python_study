[project]
name = "auth-service"
version = "0.1.0"
description = "\\"
authors = [
    {name = "gildong",email = "gildong28@naver.com"}
]

requires-python = ">=3.10,<4.0"
dependencies = [
    "gpylib @ git+https://github.com/gdygd/gpylib.git",
    "pymysql (>=1.1.2,<2.0.0)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "fastapi (>=0.135.1,<0.136.0)",
    "uvicorn[standard] (>=0.42.0,<0.43.0)",
    "pydantic[email] (>=2.12.5,<3.0.0)"
]

[tool.poetry]
packages = [
    { include = "app", from = "src" }
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)"
]
